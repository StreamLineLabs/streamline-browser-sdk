name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Release validation tests
        run: npm run test:release

      - name: Validate package metadata
        run: npm run check:metadata

      - name: Build
        run: npm run build

      - name: Compile published examples
        run: npm run check:examples

      - name: Inspect package contents
        run: node scripts/check-package.mjs

      - name: Test
        run: npm test

      - name: Validate generated SBOM
        if: matrix.node == 22
        run: npm run check:sbom
